<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RoyalStats</title>
    <link rel="stylesheet" href="calculate.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Синий фон -->
    <div class="background-blue"></div>

    <!-- Фото -->
    <div class="fullscreen-photo">
        <img src="calc.jpg" alt="фото">
    </div>

    <!-- Nav-bar -->
    <div class="navbar-overlay">
        <div class="logo"><h1>RoyalStats</h1></div>
        <ul class="nav-links">
            <li><a href="#">База знаний</a></li>
            <li><a href="#">калькулятор прокачки</a></li>
            <li><a href="#">метовые колоды</a></li>
            <li><a href="#">Нововведения</a></li>
        </ul>
    </div>

    <!-- Квадрат (НЕ ИЗМЕНЁН) -->
    <div class="square">
        <div class="square-text">выберите редкость карты:</div>
    </div>

    <div class="square-bottom">
        <div class="square-bottom-text">текущий уровень:</div>
    </div>

    <!-- Кнопки справа от квадрата (горизонтально) -->
    <div class="buttons-right">
        <button class="rarity-btn btn-common">обычная</button>
        <button class="rarity-btn btn-rare">редкая</button>
        <button class="rarity-btn btn-epic">эпическая</button>
        <button class="rarity-btn btn-legendary">легендарная</button>
        <button class="rarity-btn btn-champion">чемпион</button>
    </div>
</body>
</html>
